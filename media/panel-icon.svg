<!--
  The GitLore panel-container icon. VS Code tints this with the activity/panel foreground colour,
  so it must be a single-colour silhouette — no palette here.

  Same mark as media/icon.svg (a commit spine with the lines that commit touched running out of it),
  reduced to what survives at 24px: the highlighted commit reads as a ring, the neighbours as dots.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <circle cx="6.5" cy="4.5" r="1.7" fill="currentColor" />
  <circle cx="6.5" cy="19.5" r="1.7" fill="currentColor" />
  <line x1="6.5" y1="6.2" x2="6.5" y2="9.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="6.5" y1="14.4" x2="6.5" y2="17.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="6.5" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
  <line x1="12" y1="10.2" x2="20.5" y2="10.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  <line x1="12" y1="13.8" x2="17" y2="13.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
</svg>
